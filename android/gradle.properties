org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental caches cannot relativize plugin sources from the C: pub
# cache against this project on D:. Compile in-process without incremental
# caches so Android builds are stable on this Windows layout.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
