services:
  lip-reader:
    build:
      context: ../..
      dockerfile: packaging/deployment/Dockerfile.cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:7100:7100"
    env_file:
      - lip-reader.env
    volumes:
      - type: bind
        source: ${LIP_MODEL_BUNDLE_DIR}
        target: /models
        read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 12g
