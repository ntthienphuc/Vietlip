name: lip_reader
description: "Live Vietnamese lip reading for Android."
publish_to: 'none'

version: 1.10.5+30

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  camera: ^0.12.0+1
  dio: ^5.9.2
  go_router: ^17.2.1
  image_picker: ^1.2.1
  image: ^4.5.4
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3
  mobile_scanner: 7.5.0

dependency_overrides:
  camera_android_camerax:
    path: packages/camera_android_camerax

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/signova/
    - assets/fonts/Nunito-OFL.txt

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
